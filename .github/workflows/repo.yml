name: Build and Publish Repo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Build Release APK
      run: gradle assembleRelease

    - name: Prepare Repo Branch
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        
        APK_PATH=$(find build/outputs/apk/release -name "*.apk" | head -n 1)
        cp $APK_PATH webdav-anime-extension.apk
        
        # Copy the icon
        mkdir -p icon
        cp src/main/res/mipmap-xhdpi/ic_launcher.png icon/eu.kanade.tachiyomi.animeextension.all.webdav.png
        
        # Extract versions
        VERSION_CODE=$(grep "versionCode = " build.gradle.kts | grep -o "[0-9]*")
        VERSION_NAME=$(grep "versionName = " build.gradle.kts | grep -o '".*"' | tr -d '"')
        
        
        cat <<JSON > repo.json
        {
          "meta": {
            "name": "WebDAV Anime",
            "website": "https://github.com/Hikari2w2/webdav-anime-extension",
            "signingKeyFingerprint": "849ea632cba0df7a13cacff8abf659111b56ea9110fe33d4dbcd1c73cba7ece0"
          }
        }
        JSON
        
        cat <<JSON > index.min.json
        [
          {
            "name": "WebDAV Anime",
            "pkg": "eu.kanade.tachiyomi.animeextension.all.webdav",
            "apk": "webdav-anime-extension.apk",
            "lang": "all",
            "code": ${VERSION_CODE},
            "version": "${VERSION_NAME}",
            "nsfw": 0,
            "sources": [
              {
                "id": 10000,
                "lang": "all",
                "name": "WebDAV Server 1",
                "baseUrl": ""
              }
            ]
          }
        ]
        JSON
        
        git checkout --orphan repo
        git rm -rf .
        git add webdav-anime-extension.apk icon/eu.kanade.tachiyomi.animeextension.all.webdav.png index.min.json repo.json
        git commit -m "Update repo index and APK"
        git push origin repo --force
